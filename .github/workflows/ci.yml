name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate shell syntax
        run: bash -n install.sh
      - name: Compile Python
        run: python3 -m py_compile bin/allonsy
      - name: Smoke CLI
        run: |
          ./bin/allonsy --version
          ./bin/allonsy --help >/dev/null
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run ShellCheck
        run: shellcheck install.sh
